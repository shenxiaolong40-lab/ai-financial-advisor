<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>财务自由顾问</title>
  <meta name="theme-color" content="#10B981">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="自由顾问">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
    }
  </script>
</head>
<body>
<div id="app">

  <!-- ══════════════ PAGE: FIRE 仪表盘 ══════════════ -->
  <div id="page-fire" class="page">
    <div class="page-header">
      <h1>🔥 财务自由之路</h1>
      <button id="btn-fire-config" class="btn-icon-text">⚙️ 配置</button>
    </div>

    <!-- 核心英雄区 -->
    <div class="fire-hero">
      <div class="fire-years-label">距离财务自由</div>
      <div class="fire-years" id="fire-years">—</div>
      <div class="fire-years-unit">年</div>
      <div class="fire-subtitle" id="fire-subtitle">请先配置收入和资产信息</div>
    </div>

    <!-- 进度条 -->
    <div class="fire-progress-wrap">
      <div class="fire-progress-track">
        <div class="fire-progress-fill" id="fire-progress-bar" style="width:0%"></div>
      </div>
      <div class="fire-progress-label" id="fire-progress-label">¥0 / ¥0（0%）</div>
    </div>

    <!-- 关键指标 -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">月工资</div>
        <div class="stat-value income" id="stat-salary">—</div>
        <div class="stat-sublabel" id="stat-salary-sub">年结余 —</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">月支出</div>
        <div class="stat-value expense" id="stat-expense">—</div>
        <div class="stat-sublabel" id="stat-expense-sub">储蓄率 —</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">月被动收入</div>
        <div class="stat-value" id="stat-passive">—</div>
        <div class="stat-sublabel">资产 × 收益率 / 12</div>
      </div>
      <div class="stat-card highlight">
        <div class="stat-label">被动覆盖率</div>
        <div class="stat-value" id="stat-coverage">—</div>
        <div class="stat-sublabel">被动 / 支出</div>
      </div>
    </div>

    <!-- 预测曲线 -->
    <div class="card">
      <div class="card-title">资产增长预测</div>
      <div class="chart-wrap">
        <canvas id="chart-projection"></canvas>
      </div>
    </div>

    <!-- 收益率敏感性 -->
    <div class="card">
      <div class="card-title">收益率敏感性分析</div>
      <div id="sensitivity-wrap" class="sensitivity-wrap">
        <p class="chart-empty-tip">请先配置资产信息</p>
      </div>
    </div>

    <!-- AI 建议预览 -->
    <div class="card ai-hint-card" onclick="navigate('ai')">
      <div class="ai-hint-header">💡 AI 顾问建议</div>
      <div class="ai-hint-text" id="ai-hint-text">点击生成你的专属 FIRE 优化建议 →</div>
    </div>

    <div style="height:80px"></div>
  </div>

  <!-- ══════════════ PAGE: 财务自由说明 ══════════════ -->
  <div id="page-explain" class="page">
    <div class="page-header">
      <h1>📖 为什么需要这么多年</h1>
    </div>

    <!-- 状态占位 -->
    <div id="explain-loading" class="explain-empty">
      请先在 🔥 首页 ⚙️ 配置中填入资产、工资和支出信息
    </div>

    <!-- 核心内容（有数据时显示） -->
    <div id="explain-content" style="display:none">

      <!-- 你的财务参数 -->
      <div class="card">
        <div class="card-title">你的财务参数</div>
        <div id="explain-params" class="explain-params-grid"></div>
      </div>

      <!-- 现在的位置 -->
      <div class="card">
        <div class="card-title">你现在在哪里</div>
        <div id="explain-current" class="explain-section"></div>
      </div>

      <!-- 核心逻辑 -->
      <div class="card">
        <div class="card-title">财务自由的逻辑</div>
        <div id="explain-logic" class="explain-section"></div>
      </div>

      <!-- 关键里程碑 -->
      <div class="card">
        <div class="card-title">关键里程碑</div>
        <div id="explain-milestones" class="explain-section"></div>
      </div>

      <!-- 如何加速 -->
      <div class="card">
        <div class="card-title">收益率对达标年限的影响</div>
        <div id="explain-sensitivity" class="explain-section"></div>
      </div>

    </div>

    <div style="height:80px"></div>
  </div>

  <!-- ══════════════ PAGE: AI 顾问 ══════════════ -->
  <div id="page-ai" class="page">
    <div class="page-header">
      <h1>🤖 AI 顾问</h1>
      <button id="btn-ai-clear" class="btn-icon-text">清空</button>
    </div>

    <!-- 一键生成报告 -->
    <button id="btn-ai-analysis" class="btn btn-primary btn-full">🔍 生成 FIRE 优化报告</button>

    <!-- 快捷提问 -->
    <div id="ai-quick-prompts" class="quick-prompts"></div>

    <!-- 对话区 -->
    <div id="ai-messages" class="ai-messages"></div>

    <!-- 输入区 -->
    <div class="ai-input-bar">
      <textarea id="ai-input" class="ai-textarea" placeholder="问问你的财务自由顾问…" rows="1"></textarea>
      <button id="btn-ai-send" class="btn btn-primary btn-send">发送</button>
    </div>
  </div>

</div><!-- #app -->

<!-- ══════════════ 底部导航 ══════════════ -->
<nav class="bottom-nav">
  <button class="nav-item active" data-page="fire">
    <span class="nav-icon">🔥</span>
    <span class="nav-label">自由之路</span>
  </button>
  <button class="nav-item" data-page="explain">
    <span class="nav-icon">📖</span>
    <span class="nav-label">自由说明</span>
  </button>
  <button class="nav-item" data-page="ai">
    <span class="nav-icon">🤖</span>
    <span class="nav-label">AI 顾问</span>
  </button>
</nav>

<!-- ══════════════ MODAL: FIRE 配置 ══════════════ -->
<div id="modal-fire-config" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h3>FIRE 配置</h3>
      <button data-close class="btn-close">×</button>
    </div>
    <div class="modal-body">
      <div class="form-section-title">资产</div>
      <div class="form-group">
        <label>当前可投资总资产（元）<span class="cfg-hint">现金+股票+基金+房产等</span></label>
        <input id="cfg-total-assets" type="number" placeholder="1000000" min="0">
      </div>
      <div class="form-group">
        <label>年化理财收益率（%）<span class="cfg-hint">综合预期，指数基金约7-10%</span></label>
        <input id="cfg-annual-return" type="number" placeholder="5" min="0" max="30" step="0.1">
      </div>

      <div class="form-section-title">收入</div>
      <div class="form-group">
        <label>税后年工资（元）<span class="cfg-hint">工资+副业等固定收入</span></label>
        <input id="cfg-annual-salary" type="number" placeholder="300000" min="0">
      </div>
      <div class="form-group">
        <label>年工资增长率（%）<span class="cfg-hint">预期每年调薪幅度</span></label>
        <input id="cfg-salary-growth" type="number" placeholder="5" min="0" max="50" step="0.1">
      </div>

      <div class="form-section-title">支出</div>
      <div class="form-group">
        <label>年刚性支出（元）<span class="cfg-hint">房贷/房租、保险、教育等必须花的钱</span></label>
        <input id="cfg-fixed-expense" type="number" placeholder="120000" min="0">
      </div>
      <div class="form-group">
        <label>年弹性支出（元）<span class="cfg-hint">餐饮、娱乐、旅行等可调节消费</span></label>
        <input id="cfg-flex-expense" type="number" placeholder="60000" min="0">
      </div>
    </div>
    <div class="modal-footer">
      <button id="btn-save-config" class="btn btn-primary btn-full">保存</button>
    </div>
  </div>
</div>

<!-- ══════════════ MODAL: 登录（多用户模式）══════════════ -->
<div id="modal-login" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <h3>账户登录</h3>
      <button data-close class="btn-close">×</button>
    </div>
    <div class="modal-body">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">登录</button>
        <button class="auth-tab" data-tab="register">注册</button>
      </div>
      <div id="form-login" class="auth-form active">
        <div class="form-group"><label>邮箱</label><input id="login-email" type="email" placeholder="you@example.com"></div>
        <div class="form-group"><label>密码</label><input id="login-pw" type="password" placeholder="••••••••"></div>
        <button id="btn-login" class="btn btn-primary btn-full">登录</button>
      </div>
      <div id="form-register" class="auth-form">
        <div class="form-group"><label>邮箱</label><input id="reg-email" type="email" placeholder="you@example.com"></div>
        <div class="form-group"><label>密码</label><input id="reg-pw" type="password" placeholder="••••••••"></div>
        <button id="btn-register" class="btn btn-primary btn-full">注册</button>
      </div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/fire.js"></script>
<script src="js/explain.js"></script>
<script src="js/ai.js"></script>
</body>
</html>
